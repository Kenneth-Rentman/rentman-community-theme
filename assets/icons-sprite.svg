<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!--
    Rentman Community category icons.

    These are Lucide icons, not hand-drawn. The previous set followed the brand
    book's product-icon rule (p.26, "only rectangle and square shapes"), which
    holds shape at 16px but converges silhouettes: Getting Started, Equipment &
    Warehouse and Crew all became arrangements of small squares. Category colour
    hid that. A single-colour tile treatment does not, so the constraint that
    bought legibility cost legibility somewhere else.

    Lucide is already drawn to this spec — 24x24 grid, 2px stroke, currentColor,
    no fills — by one hand across the whole set, which is the property hardest to
    reproduce by hand and the reason for the swap.

    KNOWN TRADE: Lucide draws with round caps and joins. The Rentman logo and the
    p.26 product icons are square and geometric, so these glyphs are softer than
    the brand's own drawing language. The tile behind them is still a square, so
    the geometric cue survives, but this is a real departure and was accepted
    deliberately. The previous hand-drawn set is in git history at fb6c601 if it
    needs to come back.

    Colour is always currentColor or none; a literal would break the white/ink
    glyph switch the theme computes per category. Symbol ids are unchanged from
    the hand-drawn set, so no category needs reconfiguring in admin.

    =======================================================================
