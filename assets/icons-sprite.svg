<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!--
    Rentman Community category icons.

    Drawn in the product-icon language from the brand book p.26 — "following the
    visual style of the logo, and using only rectangle and square shapes". That
    constraint is not decoration here: these render at 16px inside a 32px tile,
    and the p.27 outline library (hairline strokes, 15-30 segments) turns to grey
    mush at that size. Rectangles hold their shape.

    Rules every symbol follows:
      - 24x24 viewBox, content inset to 2..22 so nothing touches the tile edge.
      - Colour is ALWAYS currentColor or none. A literal fill would break the
        white/ink glyph switch the grid computes per category.
      - Minimum feature 2.6px on the 24 grid, i.e. ~1.7px rendered. Below that
        it aliases.
      - Solid fills lead; an outline is used only where a container is the
        subject (document, speech bubble) or the form is inherently linear
        (brackets). Stroke weight is 2 throughout so the set holds one weight.
      - Four elements maximum. A fifth means it is a display icon, not a UI one.

    Silhouettes are deliberately distinct from one another: flag / blocks /
    staggered bars / grid / figures / document / brackets / bubble.
  -->

  <!-- Announcements. A flag: notice posted, not a celebration. -->
  <symbol id="rentman-announcements" viewBox="0 0 24 24">
    <rect x="4.4" y="2.5" width="2.7" height="19" rx="1" fill="currentColor"/>
    <rect x="7.1" y="4.2" width="11.5" height="7.6" rx="1" fill="currentColor"/>
  </symbol>

  <!-- Getting Started. Building blocks, assembling — the p.28 layout concept. -->
  <symbol id="rentman-getting-started" viewBox="0 0 24 24">
    <rect x="3.4" y="3.4" width="8" height="8" rx="1" fill="currentColor"/>
    <rect x="3.4" y="12.6" width="8" height="8" rx="1" fill="currentColor"/>
    <rect x="12.6" y="12.6" width="8" height="8" rx="1" fill="currentColor"/>
  </symbol>

  <!-- Projects. The Rentman planning board: staggered bars on a timeline. -->
  <symbol id="rentman-projects" viewBox="0 0 24 24">
    <rect x="3" y="5" width="11" height="4" rx="1" fill="currentColor"/>
    <rect x="7.5" y="10" width="13.5" height="4" rx="1" fill="currentColor"/>
    <rect x="3" y="15" width="8.5" height="4" rx="1" fill="currentColor"/>
  </symbol>

  <!-- Equipment & Warehouse. Racking: stock in bays. -->
  <symbol id="rentman-equipment" viewBox="0 0 24 24">
    <rect x="3.4" y="3.4" width="7.6" height="7.6" rx="1" fill="currentColor"/>
    <rect x="13" y="3.4" width="7.6" height="7.6" rx="1" fill="currentColor"/>
    <rect x="3.4" y="13" width="7.6" height="7.6" rx="1" fill="currentColor"/>
    <rect x="13" y="13" width="7.6" height="7.6" rx="1" fill="currentColor"/>
  </symbol>

  <!-- Crew. Two figures, head and shoulders, blocked out. -->
  <symbol id="rentman-crew" viewBox="0 0 24 24">
    <rect x="3.8" y="3.6" width="6.2" height="6.2" rx="1.6" fill="currentColor"/>
    <rect x="2.4" y="11.6" width="9" height="8.8" rx="1.6" fill="currentColor"/>
    <rect x="14" y="3.6" width="6.2" height="6.2" rx="1.6" fill="currentColor"/>
    <rect x="12.6" y="11.6" width="9" height="8.8" rx="1.6" fill="currentColor"/>
  </symbol>

  <!-- Quoting & Invoicing. A document with lines and a short total. -->
  <symbol id="rentman-quoting" viewBox="0 0 24 24">
    <rect x="5" y="2.6" width="14" height="18.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="8.6" y="7.4" width="6.8" height="2.1" rx="0.8" fill="currentColor"/>
    <rect x="8.6" y="11.4" width="6.8" height="2.1" rx="0.8" fill="currentColor"/>
    <rect x="8.6" y="15.4" width="3.8" height="2.1" rx="0.8" fill="currentColor"/>
  </symbol>

  <!-- Developers & API. Brackets. Square caps keep the rectangular language. -->
  <symbol id="rentman-developers" viewBox="0 0 24 24">
    <path d="M9.8 4.4H5.4v15.2h4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M14.2 4.4h4.4v15.2h-4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

  <!-- General Discussion. A speech bubble, tail blocked in. -->
  <symbol id="rentman-general" viewBox="0 0 24 24">
    <rect x="3" y="4.2" width="18" height="12.2" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="6.6" y="15.6" width="5" height="5" rx="1" fill="currentColor"/>
  </symbol>
</svg>
